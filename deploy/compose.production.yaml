services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - admin-frontend
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

volumes:
  caddy_data:
  caddy_config:
