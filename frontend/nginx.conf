server {
 listen 8080;
 server_name _;
 resolver 127.0.0.11 valid=10s ipv6=off;
 set $backend_upstream backend:8080;
 root /usr/share/nginx/html;
 index index.html;
 # Message videos are limited to 50 MB by the backend. Keep a small margin
 # for multipart form metadata.
 client_max_body_size 52m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location /api/ { proxy_pass http://$backend_upstream; proxy_set_header Host $http_host; }
 location /webhooks/ { proxy_pass http://$backend_upstream; proxy_set_header Host $http_host; }
 location = /healthz { proxy_pass http://$backend_upstream; }
 location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
 location / { try_files $uri $uri/ /index.html; }
}

# Dedicated ingress for public provider callbacks. The ngrok tunnel points to
# this listener, so the admin UI and REST API stay local-only.
server {
 listen 8081;
 server_name _;
 resolver 127.0.0.11 valid=10s ipv6=off;
 set $backend_upstream backend:8080;
 client_max_body_size 1m;
 add_header X-Content-Type-Options nosniff always;

 location = /webhooks/telegram {
  proxy_pass http://$backend_upstream;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
 }

 location = /webhooks/lava {
  proxy_pass http://$backend_upstream;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
 }

 location = /healthz { proxy_pass http://$backend_upstream; }
 location / { return 404; }
}
